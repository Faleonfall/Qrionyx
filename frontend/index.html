<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Qrionyx</title>
    <meta name="theme-color" content="#071018" />
    <!-- Applies the saved theme, else the system one, before first paint.
         The key matches themeStorageKey in src/lib/themePreference.ts, and
         the colors match --color-page, which useTheme reads once mounted -->
    <script>
      let theme = null;
      try {
        theme = localStorage.getItem("qrionyx.theme");
      } catch {}
      if (theme !== "dark" && theme !== "light") {
        theme = matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
      if (theme === "light") {
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", "#f1f5f9");
      }
    </script>
    <meta
      name="description"
      content="Qrionyx generates styled QR codes right in your browser. Pick dot shapes, corners, colors and gradients, add a logo, check that it scans, and export PNG, WEBP or SVG. Nothing is uploaded."
    />
    <link rel="canonical" href="https://faleonfall.github.io/Qrionyx/" />
    <meta name="application-name" content="Qrionyx" />
    <meta name="apple-mobile-web-app-title" content="Qrionyx" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Qrionyx" />
    <meta property="og:url" content="https://faleonfall.github.io/Qrionyx/" />
    <meta property="og:title" content="Qrionyx, a local QR generator" />
    <meta
      property="og:description"
      content="Styled QR codes, generated locally in your browser."
    />
    <meta
      property="og:image"
      content="https://faleonfall.github.io/Qrionyx/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Qrionyx logo and name beside a purple styled QR code on a dark grid background."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Qrionyx",
        "alternateName": "Qrionyx, a local QR generator",
        "url": "https://faleonfall.github.io/Qrionyx/",
        "image": "https://faleonfall.github.io/Qrionyx/og-image.png",
        "description": "Styled QR codes, generated locally in your browser.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon-dark.svg" />
    <link rel="manifest" href="./site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="app"></div>
    <noscript>Enable JavaScript to generate QR codes locally.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
